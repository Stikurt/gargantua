name: gargantua-mvp
services:
  app:
    build: .
    image: gargantua-mvp:local
    ports: ["127.0.0.1:3080:3080"]
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/mvp/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
